name: Build BLACKSTRINGS Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK - Install API 35
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: List files - Check what is missing
        run: |
          ls -la
          echo "--- app ---"
          ls -la app || echo "NO app folder!"
          echo "--- gradle wrapper ---"
          ls -la gradle/wrapper || echo "NO gradle/wrapper folder!"

      - name: Create gradlew if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew missing - creating it..."
            gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew
          ls -lh gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackstrings-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
